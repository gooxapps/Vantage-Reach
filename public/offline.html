<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Vantage Reach</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        background: #f8fafc;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #1d4ed8;
        color: #ffffff;
        font-weight: 700;
        font-size: 20px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #475569;
        margin: 0 0 24px;
      }
      button {
        background: #1d4ed8;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">VR</div>
      <h1>You are currently offline</h1>
      <p>
        Vantage Reach could not reach the server. Your saved views remain intact locally—reconnect to sync live YouTube statistics, Gemini SEO analysis, and campaign updates.
      </p>
      <button id="retry-btn" type="button">Try Again</button>
    </main>
    <script>
      async function recoverIfOnline() {
        try {
          const res = await fetch('/api/health', { cache: 'no-store' });
          if (res.ok) {
            if ('serviceWorker' in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map((r) => r.unregister()));
            }
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            }
            window.location.replace('/');
          }
        } catch (e) {}
      }
      document.getElementById('retry-btn').addEventListener('click', recoverIfOnline);
      recoverIfOnline();
    </script>
  </body>
</html>
